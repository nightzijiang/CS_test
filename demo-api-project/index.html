<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API 接口演示</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 40px 20px;
    }
    
    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: white;
      border-radius: 10px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      overflow: hidden;
    }
    
    .header {
      background: #667eea;
      color: white;
      padding: 30px;
      text-align: center;
    }
    
    .header h1 {
      margin-bottom: 10px;
    }
    
    .content {
      padding: 30px;
    }
    
    .section {
      margin-bottom: 30px;
    }
    
    .section h2 {
      color: #333;
      margin-bottom: 15px;
      border-bottom: 2px solid #667eea;
      padding-bottom: 10px;
    }
    
    .form-group {
      margin-bottom: 15px;
    }
    
    .form-group label {
      display: block;
      margin-bottom: 5px;
      color: #555;
      font-weight: 500;
    }
    
    .form-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-size: 14px;
    }
    
    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
      margin-right: 10px;
      transition: all 0.3s;
    }
    
    .btn-primary {
      background: #667eea;
      color: white;
    }
    
    .btn-primary:hover {
      background: #5568d3;
    }
    
    .btn-success {
      background: #48bb78;
      color: white;
    }
    
    .btn-success:hover {
      background: #38a169;
    }
    
    .btn-danger {
      background: #f56565;
      color: white;
    }
    
    .btn-danger:hover {
      background: #e53e3e;
    }
    
    .user-list {
      list-style: none;
    }
    
    .user-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px;
      border: 1px solid #e2e8f0;
      border-radius: 5px;
      margin-bottom: 10px;
      background: #f7fafc;
    }
    
    .user-info {
      flex: 1;
    }
    
    .user-name {
      font-weight: bold;
      color: #2d3748;
    }
    
    .user-email {
      color: #718096;
      font-size: 14px;
    }
    
    .user-actions {
      display: flex;
      gap: 10px;
    }
    
    .response-box {
      background: #1a202c;
      color: #48bb78;
      padding: 15px;
      border-radius: 5px;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      max-height: 300px;
      overflow-y: auto;
      white-space: pre-wrap;
    }
    
    .loading {
      text-align: center;
      color: #667eea;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🚀 RESTful API 接口演示</h1>
      <p>前后端交互完整示例</p>
    </div>
    
    <div class="content">
      <!-- 创建用户表单 -->
      <div class="section">
        <h2>➕ 创建新用户</h2>
        <div class="form-group">
          <label for="newName">姓名</label>
          <input type="text" id="newName" placeholder="请输入姓名">
        </div>
        <div class="form-group">
          <label for="newEmail">邮箱</label>
          <input type="email" id="newEmail" placeholder="请输入邮箱">
        </div>
        <button class="btn btn-success" onclick="createUser()">创建用户</button>
      </div>
      
      <!-- 用户列表 -->
      <div class="section">
        <h2>👥 用户列表</h2>
        <button class="btn btn-primary" onclick="loadUsers()">刷新列表</button>
        <ul class="user-list" id="userList"></ul>
      </div>
      
      <!-- API 响应展示 -->
      <div class="section">
        <h2>📡 API 响应</h2>
        <div class="response-box" id="responseBox">等待请求...</div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = 'http://localhost:3000/api';

    // 显示响应结果
    function showResponse(data) {
      const responseBox = document.getElementById('responseBox');
      responseBox.textContent = JSON.stringify(data, null, 2);
    }

    // 加载所有用户
    async function loadUsers() {
      try {
        const userList = document.getElementById('userList');
        userList.innerHTML = '<li class="loading">加载中...</li>';
        
        const response = await fetch(`${API_BASE}/users`);
        const result = await response.json();
        
        showResponse(result);
        
        if (result.success && result.data.length > 0) {
          userList.innerHTML = result.data.map(user => `
            <li class="user-item">
              <div class="user-info">
                <div class="user-name">${user.name}</div>
                <div class="user-email">${user.email}</div>
              </div>
              <div class="user-actions">
                <button class="btn btn-primary" onclick="editUser(${user.id})">编辑</button>
                <button class="btn btn-danger" onclick="deleteUser(${user.id})">删除</button>
              </div>
            </li>
          `).join('');
        } else {
          userList.innerHTML = '<li class="loading">暂无用户数据</li>';
        }
      } catch (error) {
        showResponse({ error: error.message });
        document.getElementById('userList').innerHTML = '<li class="loading">加载失败，请确保后端服务已启动</li>';
      }
    }

    // 创建用户
    async function createUser() {
      const name = document.getElementById('newName').value.trim();
      const email = document.getElementById('newEmail').value.trim();
      
      if (!name || !email) {
        alert('请填写姓名和邮箱');
        return;
      }
      
      try {
        const response = await fetch(`${API_BASE}/users`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ name, email })
        });
        
        const result = await response.json();
        showResponse(result);
        
        if (result.success) {
          document.getElementById('newName').value = '';
          document.getElementById('newEmail').value = '';
          loadUsers();
        }
      } catch (error) {
        showResponse({ error: error.message });
      }
    }

    // 编辑用户
    async function editUser(id) {
      const newName = prompt('请输入新姓名:');
      if (!newName) return;
      
      const newEmail = prompt('请输入新邮箱:');
      if (!newEmail) return;
      
      try {
        const response = await fetch(`${API_BASE}/users/${id}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ name: newName, email: newEmail })
        });
        
        const result = await response.json();
        showResponse(result);
        
        if (result.success) {
          loadUsers();
        }
      } catch (error) {
        showResponse({ error: error.message });
      }
    }

    // 删除用户
    async function deleteUser(id) {
      if (!confirm('确定要删除这个用户吗？')) return;
      
      try {
        const response = await fetch(`${API_BASE}/users/${id}`, {
          method: 'DELETE'
        });
        
        const result = await response.json();
        showResponse(result);
        
        if (result.success) {
          loadUsers();
        }
      } catch (error) {
        showResponse({ error: error.message });
      }
    }

    // 页面加载时获取用户列表
    window.onload = loadUsers;
  </script>
</body>
</html>
